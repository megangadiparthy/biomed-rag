[project]
name = "biomed-rag"
version = "0.1.0"
description = "Hybrid PubMed retrieval with BM25, Qdrant, and citation-checked answers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "qdrant-client>=1.12",
  "numpy>=1.26",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.44", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
biomed-rag = "biomed_rag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
